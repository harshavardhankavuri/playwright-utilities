# ─────────────────────────────────────────────────────────────────────────────
# GitHub Actions — Playwright E2E Tests
# ─────────────────────────────────────────────────────────────────────────────
# Configurable parameters via workflow_dispatch inputs or environment variables.
#
# Triggers:
#   - Push to main/develop
#   - Pull requests to main
#   - Manual dispatch with configurable parameters
# ─────────────────────────────────────────────────────────────────────────────

name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test against'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - staging
          - prod
      project:
        description: 'Browser project to run'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all
      workers:
        description: 'Number of parallel workers'
        required: false
        default: '4'
        type: string
      retries:
        description: 'Number of retries for failed tests'
        required: false
        default: '2'
        type: string
      shard:
        description: 'Shard index (e.g. 1/3 for first of 3 shards)'
        required: false
        default: ''
        type: string
      tags:
        description: 'Test tags to filter (e.g. @smoke)'
        required: false
        default: ''
        type: string
      report_mode:
        description: 'Report mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - single
      xray_enabled:
        description: 'Push results to X-Ray'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  CI: true
  ENV: ${{ github.event.inputs.environment || 'dev' }}
  REPORT_MODE: ${{ github.event.inputs.report_mode || 'full' }}

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # When shard is specified, split across multiple runners
        shard: ${{ github.event.inputs.shard && fromJSON(format('["{0}"]', github.event.inputs.shard)) || fromJSON('[""]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ github.event.inputs.project != 'all' && github.event.inputs.project || '' }}

      - name: Run Playwright tests
        run: |
          ARGS=""

          # Project selection
          PROJECT="${{ github.event.inputs.project || 'chromium' }}"
          if [ "$PROJECT" != "all" ]; then
            ARGS="$ARGS --project=$PROJECT"
          fi

          # Workers
          WORKERS="${{ github.event.inputs.workers || '4' }}"
          ARGS="$ARGS --workers=$WORKERS"

          # Retries
          RETRIES="${{ github.event.inputs.retries || '2' }}"
          ARGS="$ARGS --retries=$RETRIES"

          # Shard
          SHARD="${{ matrix.shard }}"
          if [ -n "$SHARD" ]; then
            ARGS="$ARGS --shard=$SHARD"
          fi

          # Tags (grep filter)
          TAGS="${{ github.event.inputs.tags }}"
          if [ -n "$TAGS" ]; then
            ARGS="$ARGS --grep=\"$TAGS\""
          fi

          npx playwright test $ARGS
        env:
          XRAY_ENABLED: ${{ github.event.inputs.xray_enabled || 'false' }}
          XRAY_FEATURE_UPDATE_STATUS: ${{ github.event.inputs.xray_enabled || 'false' }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.event.inputs.project || 'chromium' }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}
          path: allure-results/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.event.inputs.project || 'chromium' }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}
          path: test-results/
          retention-days: 7

      - name: Generate Allure report
        if: always()
        run: |
          npm install -g allure-commandline
          if [ "${{ github.event.inputs.report_mode }}" = "single" ]; then
            node scripts/allure-single.js
          else
            npx allure generate allure-results --clean -o reports/allure
          fi

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.event.inputs.project || 'chromium' }}
          path: reports/
          retention-days: 30
