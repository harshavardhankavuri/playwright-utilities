# ─────────────────────────────────────────────────────────────────────────────
# GitHub Actions — Playwright E2E Tests
# ─────────────────────────────────────────────────────────────────────────────
# Configurable parameters via workflow_dispatch inputs or environment variables.
#
# Triggers:
#   - Push to main/develop
#   - Pull requests to main
#   - Manual dispatch with configurable parameters
# ─────────────────────────────────────────────────────────────────────────────

name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test against'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - staging
          - prod
      project:
        description: 'Browser project to run'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all
      workers:
        description: 'Number of parallel workers'
        required: false
        default: '4'
        type: string
      retries:
        description: 'Number of retries for failed tests'
        required: false
        default: '2'
        type: string
      shard:
        description: 'Shard index (e.g. 1/3 for first of 3 shards)'
        required: false
        default: ''
        type: string
      tags:
        description: 'Test tags to filter (e.g. @smoke)'
        required: false
        default: ''
        type: string
      report_mode:
        description: 'Report mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - single
      update_snapshots:
        description: 'Capture/update visual baselines and commit them back'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      xray_enabled:
        description: 'Push results to X-Ray'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  CI: true
  ENV: ${{ github.event.inputs.environment || 'dev' }}
  REPORT_MODE: ${{ github.event.inputs.report_mode || 'full' }}

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # Required to push updated baselines back when update_snapshots=true

    strategy:
      fail-fast: false
      matrix:
        # When shard is specified, split across multiple runners
        shard: ${{ github.event.inputs.shard && fromJSON(format('["{0}"]', github.event.inputs.shard)) || fromJSON('[""]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Full history + write token so the auto-commit step can push baseline updates
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ github.event.inputs.project != 'all' && github.event.inputs.project || '' }}

      - name: Run Playwright tests
        run: |
          ARGS=""

          # Project selection
          PROJECT="${{ github.event.inputs.project || 'chromium' }}"
          if [ "$PROJECT" != "all" ]; then
            ARGS="$ARGS --project=$PROJECT"
          fi

          # Workers
          WORKERS="${{ github.event.inputs.workers || '4' }}"
          ARGS="$ARGS --workers=$WORKERS"

          # Retries
          RETRIES="${{ github.event.inputs.retries || '2' }}"
          ARGS="$ARGS --retries=$RETRIES"

          # Shard
          SHARD="${{ matrix.shard }}"
          if [ -n "$SHARD" ]; then
            ARGS="$ARGS --shard=$SHARD"
          fi

          # Tags (grep filter)
          TAGS="${{ github.event.inputs.tags }}"
          if [ -n "$TAGS" ]; then
            ARGS="$ARGS --grep=\"$TAGS\""
          fi

          npx playwright test $ARGS
        env:
          UPDATE_SNAPSHOTS: ${{ github.event.inputs.update_snapshots || 'false' }}
          XRAY_ENABLED: ${{ github.event.inputs.xray_enabled || 'false' }}
          XRAY_FEATURE_UPDATE_STATUS: ${{ github.event.inputs.xray_enabled || 'false' }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

      - name: Generate reports
        if: always()
        run: |
          npm install -g allure-commandline
          # Always generate Playwright HTML report
          # (already generated by the reporter, just ensure output folder exists)
          mkdir -p reports/html

          # Generate Allure single-file report (no trace attachments in HTML)
          node scripts/allure-single.js

          # Also generate full Allure report for detailed debugging
          npx allure generate allure-results --clean -o reports/allure-full

      - name: Commit updated baselines
        if: ${{ always() && github.event.inputs.update_snapshots == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __snapshots__
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "chore: update visual baselines (linux) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload Allure single-file report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-single-report-${{ github.event.inputs.project || 'chromium' }}
          path: reports/allure-single/index.html
          retention-days: 30

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-html-report-${{ github.event.inputs.project || 'chromium' }}
          path: reports/html/
          retention-days: 30

      - name: Upload Allure results (raw, with traces)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-results-${{ github.event.inputs.project || 'chromium' }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}
          path: allure-results/
          retention-days: 30

      - name: Upload test results (traces, screenshots, videos)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ github.event.inputs.project || 'chromium' }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}
          path: test-results/
          retention-days: 7
